name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.0'
          - php: '8.2'
            testbench: '^10.0'
          - php: '8.3'
            testbench: '^11.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, curl
          coverage: none

      - name: Install dependencies for this Testbench version
        run: composer update --prefer-dist --no-interaction --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Check code formatting
        run: vendor/bin/pint --test
